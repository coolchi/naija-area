# nginx reverse proxy (alternative to Caddy) behind Cloudflare (launch PREPARATION, NOT RUN; `nginx -t` was not available where this was written).
# Put the http-level lines in /etc/nginx/conf.d/naija-area.conf. Fill in the domain and certificate paths (Cloudflare Origin Certificate works with SSL mode "Full (strict)").
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=na_api:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name play.example.com;
    ssl_certificate     /etc/ssl/naija-area/origin.pem;
    ssl_certificate_key /etc/ssl/naija-area/origin.key;
    client_max_body_size 2m;
    # restore the real visitor address from Cloudflare (only trust Cloudflare's published ranges: list them with `set_real_ip_from` lines from https://www.cloudflare.com/ips/)
    # set_real_ip_from 173.245.48.0/20;  ... (all ranges) ...
    real_ip_header CF-Connecting-IP;

    location = /healthz { proxy_pass http://127.0.0.1:3000; access_log off; }
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }
    location /api/payments/webhook { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_request_buffering on; }
    location / {
        limit_req zone=na_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server { listen 80; server_name play.example.com; return 301 https://$host$request_uri; }
