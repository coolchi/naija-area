<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Naija Area</title><link rel="stylesheet" href="/pages.css"><meta name="robots" content="noindex"></head><body>
<header class="top"><a href="/"><img src="/assets/logo.svg" alt="Naija Area"></a><b>Admin · moderation queue</b></header>
<main><div class="card" id="login"><label>Admin password</label><div class="row"><input id="pw" type="password" style="flex:1"><button id="go">Log in</button></div><div class="err" id="err"></div></div><div id="out" style="display:none">
<div class="card"><h2>Overview</h2><div id="ov"></div></div>
<div class="card"><h2>Campaigns</h2><div class="row"><select id="st" style="width:auto"><option value="human_review">Needs review</option><option value="live,scheduled,approved">Running / approved</option><option value="rejected,takedown">Rejected / taken down</option><option value="auto_checks,human_review,approved,scheduled,live,completed,rejected,takedown">All</option></select><button class="ghost" id="reload">Reload</button></div><div id="q"></div></div>
<div class="card"><h2>Player reports</h2><div class="row"><select id="rst" style="width:auto"><option value="open">Open</option><option value="actioned,dismissed">Resolved</option></select><button class="ghost" id="rreload">Reload</button></div><div id="rq"></div></div></div></main><script src="/js/admin.js"></script></body></html>
